name: Build MFO_SPRtoBMP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: List all files for debug
      run: Get-ChildItem -Recurse

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release
      run: msbuild .\SPRtoBMP.sln /p:Configuration=Release

    - name: Pack zip
      run: |
        Compress-Archive -Path bin\Release\* -DestinationPath MFO_SPRtoBMP.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MFO_SPRtoBMP
        path: MFO_SPRtoBMP.zip
