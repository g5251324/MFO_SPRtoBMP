name: Build MFO_SPRtoBMP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install VS BuildTools, MFC + Windows SDK 10.0.14393
      run: |
        choco install visualstudio2022-buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.MFC --add Microsoft.VisualStudio.Component.Windows10SDK.14393"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release
      run: msbuild .\SPRtoBMP.sln /p:Configuration=Release

    - name: Pack zip
      run: |
        Compress-Archive -Path bin\Release\* -DestinationPath MFO_SPRtoBMP.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MFO_SPRtoBMP
        path: MFO_SPRtoBMP.zip
