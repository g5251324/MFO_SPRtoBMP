name: Build MFO_SPRtoBMP

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 手動點擊觸發

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release
      run: msbuild MFO_SPRtoBMP.sln /p:Configuration=Release

    - name: Pack zip
      run: |
        Compress-Archive -Path bin\Release\* -DestinationPath MFO_SPRtoBMP.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MFO_SPRtoBMP
        path: MFO_SPRtoBMP.zip
